name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npx --yes awesome-lint README.md
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check-i18n.py
