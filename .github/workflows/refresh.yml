name: refresh
"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: measure every linked repo and rewrite the numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify.py refresh --apply
      - name: English/Chinese mirror must stay in step
        run: python3 scripts/check-i18n.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: awesome-lint
        run: npx --yes awesome-lint README.md
      - name: link check (reported, not gating)
        continue-on-error: true
        run: python3 scripts/verify.py links
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: data/refresh
          title: "data: refresh measured numbers"
          body: |
            Regenerated by the refresh workflow (`python3 scripts/verify.py refresh --apply`).
            Only `★ <n>`, `<n> forks` and `pushed <date>` tokens on entry bullets, plus the
            refreshed-date line, are rewritten; `created <date>` and all prose are untouched.
