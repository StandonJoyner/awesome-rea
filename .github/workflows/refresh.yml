name: refresh
"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: measure every linked repo and update the corpus numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify.py refresh --apply
      - name: regenerate both READMEs from the corpus
        run: python3 scripts/render.py
      - name: the READMEs must be exactly that render
        run: python3 scripts/render.py --check
      - name: English/Chinese mirror must stay in step
        run: python3 scripts/check-i18n.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: awesome-lint
        run: npx --yes awesome-lint README.md
      - name: link check (reported, not gating)
        continue-on-error: true
        run: python3 scripts/verify.py links
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: data/refresh
          title: "data: refresh measured numbers"
          body: |
            Measured by the refresh workflow (`python3 scripts/verify.py refresh --apply`, then
            `python3 scripts/render.py`). `--apply` writes `measured` and the `refreshed` date into
            `data/entries.json`; the two READMEs are then regenerated from that corpus, so this diff is
            the corpus plus its render and never an edited bullet. Descriptions, `created <date>` and
            prose are untouched. Any slug the API did not return keeps its last-known numbers and is
            named in the job log (`kept last-known numbers`); finishing the run is the fix, not editing
            a date.
